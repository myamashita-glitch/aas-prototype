<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SIGNATE Cloud Login (Prototype)</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --shadow:0 10px 28px rgba(16,24,40,.12);
      --orange:#ee964b;
      --orangeHover:#e88736;
      --blue:#1e7fe6;
      --blueHover:#1768bf;
      --dark:#2f2f2f;
      --radius:8px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    header{
      height:66px;
      background:var(--dark);
      color:#fff;
      display:flex;
      align-items:center;
      padding:0 22px;
      box-shadow:0 2px 12px rgba(0,0,0,.2);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      letter-spacing:.2px;
      font-size:26px;
    }
    .logoMark{
      width:28px;height:28px;display:inline-block;
      background:conic-gradient(from 200deg, #ffffff 0 25%, rgba(255,255,255,.55) 25% 55%, rgba(255,255,255,.25) 55% 100%);
      clip-path: polygon(50% 5%, 95% 90%, 5% 90%);
      transform: skewX(-6deg);
    }
    .wrap{
      min-height:calc(100vh - 66px);
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:42px 16px 70px;
    }
    .card{
      width:min(760px, 100%);
      background:var(--card);
      border:1px solid var(--border);
      border-radius:6px;
      box-shadow:var(--shadow);
      padding:34px 42px;
    }
    h1{
      margin:0 0 28px;
      font-size:20px;
      font-weight:700;
      text-align:center;
      color:#1f2937;
    }
    .grid{
      display:grid;
      grid-template-columns: 160px 1fr;
      gap:18px 18px;
      align-items:center;
    }
    .label{
      color:#111827;
      font-size:14px;
      font-weight:600;
      text-align:right;
      padding-right:10px;
    }
    .field{
      position:relative;
    }
    input[type="email"], input[type="password"], input[type="text"]{
      width:100%;
      height:44px;
      border:1px solid var(--border);
      border-radius:2px;
      padding:0 12px;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    input:focus{
      border-color:#b6c6ff;
      box-shadow:0 0 0 3px rgba(59,130,246,.12);
    }
    .eyeBtn{
      position:absolute;
      right:10px; top:50%;
      transform:translateY(-50%);
      width:34px; height:34px;
      border:none;
      border-radius:6px;
      background:transparent;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      color:#374151;
    }
    .eyeBtn:hover{ background:#f3f4f6; }
    .row{
      grid-column: 2 / 3;
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      margin-top:2px;
    }
    .row input{ width:18px; height:18px; }
    .btn{
      width:100%;
      height:56px;
      border:none;
      border-radius:2px;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .btnOrange{ background:var(--orange); color:#fff; }
    .btnOrange:hover{ background:var(--orangeHover); }
    .btnBlue{ background:var(--blue); color:#fff; }
    .btnBlue:hover{ background:var(--blueHover); }

    .links{
      text-align:center;
      margin:14px 0 20px;
      font-size:14px;
      font-weight:700;
      color:var(--orange);
      line-height:1.9;
    }
    .links a{
      color:var(--orange);
      text-decoration:none;
    }
    .links a:hover{ text-decoration:underline; }
    .actions{
      grid-column: 1 / 3;
      margin-top:14px;
    }
    .divider{
      height:1px;
      background:var(--border);
      margin:22px 0;
    }
    .helper{
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media (max-width: 640px){
      .card{ padding:26px 18px; }
      .grid{ grid-template-columns: 1fr; }
      .label{ text-align:left; padding:0; }
      .row{ grid-column:auto; }
      .actions{ grid-column:auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand" aria-label="SIGNATE Cloud">
      <span class="logoMark" aria-hidden="true"></span>
      <span>Cloud</span>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>SIGNATE Cloud にサインインする</h1>

      <form id="loginForm">
        <div class="grid">
          <div class="label">メールアドレス</div>
          <div class="field">
            <input id="email" type="email" placeholder="メールアドレスを入力してください" autocomplete="email" required />
          </div>

          <div class="label">パスワード</div>
          <div class="field">
            <input id="password" type="password" placeholder="パスワードを入力してください" autocomplete="current-password" required />
            <button class="eyeBtn" type="button" id="togglePw" aria-label="パスワードを表示/非表示">
              <!-- eye icon -->
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>

          <div class="label"></div>
          <label class="row">
            <input id="remember" type="checkbox" />
            サインイン状態を保持する
          </label>

          <div class="actions">
            <button class="btn btnOrange" type="submit" aria-label="サインイン">
              <!-- login icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M21 3v18"></path>
              </svg>
              サインイン
            </button>

            <div class="links">
              <div><a href="#" onclick="alert('プロトタイプ：未実装です');return false;">➜ パスワードを忘れた方</a></div>
              <div><a href="#" onclick="alert('プロトタイプ：未実装です');return false;">➜ サインインでお困りの方はこちら</a></div>
            </div>

            <button class="btn btnBlue" type="button" onclick="alert('プロトタイプ：SSOは未実装です（ここは後でAPI/IdP連携）')">
              ➜ Microsoft Entra ID でサインイン
            </button>

            <div style="height:14px"></div>

            <button class="btn btnBlue" type="button" onclick="alert('プロトタイプ：SSOは未実装です（ここは後でAPI/IdP連携）')">
              ➜ Okta でサインイン
            </button>

            <div class="helper">※これはプロトタイプです。入力内容の検証/認証は行いません。</div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script>
    // すでにログイン済みならプロトタイプへ（戻ってきた時用）
    (function autoRedirectIfLoggedIn(){
      if (localStorage.getItem("aas_logged_in") === "1") {
        const repo = (location.pathname.split("/").filter(Boolean)[0]) || "";
        const base = repo ? `/${repo}` : "";
        location.replace(`${base}/prototype/index.html`);
      }
    })();

    // password toggle
    const pw = document.getElementById("password");
    document.getElementById("togglePw").addEventListener("click", () => {
      pw.type = (pw.type === "password") ? "text" : "password";
    });

    // submit
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const remember = document.getElementById("remember").checked;

      // プロトタイプ：認証成功扱い
      localStorage.setItem("aas_logged_in", "1");
      localStorage.setItem("aas_user_email", email || "user@example.com");
      localStorage.setItem("aas_remember", remember ? "1" : "0");

      // リポジトリ名を自動判定して /prototype/index.html へ
      const repo = (location.pathname.split("/").filter(Boolean)[0]) || "";
      const base = repo ? `/${repo}` : "";
      window.location.href = `${base}/prototype/index.html`;
    });
  </script>
</body>
</html>
