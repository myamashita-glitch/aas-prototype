<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - Prototype</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --border:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --shadow:0 10px 28px rgba(16,24,40,.12);
      --dark:#2f2f2f;
      --blue:#2563eb;
      --orange:#ee964b;
      --green:#16a34a;
      --radius:10px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
      color:var(--text);
      background:var(--bg);
      font-size:14px; /* 他ページに合わせる */
    }
    a{color:inherit}

    /* ===== Topbar (スクショ風) ===== */
    .topbar{
      height:60px;
      background:#2f2f2f;
      color:#fff;
      position:sticky;
      top:0;
      z-index:50;
      box-shadow:0 2px 12px rgba(0,0,0,.25);
    }
    .topbar__inner{
      height:100%;
      max-width:1280px;
      margin:0 auto;
      padding:0 16px;
      display:flex;
      align-items:center;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:#fff;
      font-weight:900;
      font-size:22px;
      letter-spacing:.2px;
      flex:0 0 auto;
    }
    .logoMark{
      width:26px;height:26px;display:inline-block;
      background:conic-gradient(from 200deg, #ffffff 0 25%, rgba(255,255,255,.55) 25% 55%, rgba(255,255,255,.25) 55% 100%);
      clip-path: polygon(50% 5%, 95% 90%, 5% 90%);
      transform: skewX(-6deg);
    }
    .brandText{ transform:translateY(1px); }

    .gnav{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
      flex:1 1 auto;
      overflow:hidden;
    }
    .gnav__item{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
      white-space:nowrap;
      border:1px solid transparent;
      opacity:.95;
    }
    .gnav__item:hover{
      background:rgba(255,255,255,.08);
      border-color:rgba(255,255,255,.08);
    }
    .gnav__icon{ font-size:15px; opacity:.95; }

    .utils{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
    }
    .utils__link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
      opacity:.95;
      white-space:nowrap;
    }
    .utils__link:hover{ background:rgba(255,255,255,.08); }
    .utils__icon{ font-size:15px; }

    .iconBtn{
      width:40px;
      height:40px;
      border:none;
      border-radius:12px;
      background:rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      font-size:18px;
    }
    .iconBtn:hover{ background:rgba(255,255,255,.14); }

    .userMenu{ position:relative; }
    .userBtn{
      display:flex;
      align-items:center;
      gap:10px;
      border:none;
      cursor:pointer;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.08);
      color:#fff;
      font-weight:900;
      font-size:14px;
    }
    .userBtn:hover{ background:rgba(255,255,255,.14); }
    .userAvatar{
      width:26px;height:26px;
      display:grid;place-items:center;
      border-radius:10px;
      background:rgba(255,255,255,.12);
      font-size:14px;
    }
    .caret{ opacity:.9; }

    .menu{
      position:absolute;
      right:0;
      top:46px;
      min-width:180px;
      background:#fff;
      color:#111827;
      border:1px solid #e5e7eb;
      border-radius:12px;
      box-shadow:0 18px 40px rgba(16,24,40,.18);
      padding:6px;
      display:none;
    }
    .menu.open{ display:block; }
    .menu button{
      width:100%;
      border:none;
      background:transparent;
      text-align:left;
      padding:10px 10px;
      border-radius:10px;
      font-weight:800;
      cursor:pointer;
      color:#111827;
    }
    .menu button:hover{ background:#f3f4f6; }

    @media (max-width: 960px){
      .gnav{ display:none; } /* まずは簡易：狭いときはナビを隠す */
    }

    /* ===== Page layout (元のまま) ===== */
    .page{
      max-width:1200px;
      margin:0 auto;
      padding:22px 16px 60px;
    }

    .layout{
      display:grid;
      grid-template-columns: 1fr 320px;
      gap:18px;
      align-items:start;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .cardPad{ padding:16px 16px; }
    .muted{ color:var(--muted); }

    .summaryGrid{
      display:grid;
      grid-template-columns: 280px 1fr;
      gap:14px;
      margin-bottom:14px;
    }
    .profile{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .avatar{
      width:48px;height:48px;border-radius:14px;
      background:linear-gradient(135deg, #a78bfa, #60a5fa);
      display:grid; place-items:center;
      color:#fff; font-weight:900;
    }
    .name{ font-weight:900; font-size:16px; }
    .lv{ color:#f59e0b; font-weight:900; margin-top:2px; }
    .kvRow{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:8px;
    }
